name: MobiliApp · APK Android

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'mobiliapp/**'
      - '.github/workflows/mobiliapp-android-apk.yml'
  workflow_dispatch:

concurrency:
  group: mobiliapp-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Gerar APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobiliapp
    env:
      CI: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobiliapp/package-lock.json

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck e testes
        run: |
          npx tsc --noEmit
          npx jest --ci

      - name: Versão do build
        id: version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=MobiliApp-${VERSION}-build${GITHUB_RUN_NUMBER}.apk" >> "$GITHUB_OUTPUT"
          # versionCode crescente: cada APK novo instala por cima do anterior.
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            cfg.expo.android = { ...cfg.expo.android, versionCode: Number(process.env.GITHUB_RUN_NUMBER) };
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2));
          "

      - name: Gerar projeto Android (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Compilar APK (release)
        working-directory: mobiliapp/android
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Preparar arquivo
        run: cp android/app/build/outputs/apk/release/app-release.apk "${{ steps.version.outputs.apk }}"

      - name: Enviar artefato
        uses: actions/upload-artifact@v4
        with:
          name: mobiliapp-apk
          path: mobiliapp/${{ steps.version.outputs.apk }}
          if-no-files-found: error
          retention-days: 30

      - name: Publicar pre-release com o APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobiliapp-v${{ steps.version.outputs.version }}-build${{ github.run_number }}
          name: MobiliApp ${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: mobiliapp/${{ steps.version.outputs.apk }}
          body: |
            APK de teste do MobiliApp, gerado a partir do commit ${{ github.sha }} (branch `${{ github.ref_name }}`).

            **Como instalar no Android**
            1. Abra esta página no celular e toque em `${{ steps.version.outputs.apk }}` para baixar.
            2. Abra o arquivo baixado. Se o Android pedir, permita "instalar apps desconhecidos" para o navegador ou gerenciador de arquivos.
            3. Toque em **Instalar**.

            Builds novos instalam por cima do anterior, mantendo seus dados.
            APK assinado com chave de desenvolvimento: serve para testes, não para publicar na Play Store.
